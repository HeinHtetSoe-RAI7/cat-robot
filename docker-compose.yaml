services:
  vosk_asr:
    container_name: vosk_asr
    build: ./vosk_asr
    ports:
      - "2700:2700"
    volumes:
      - ./vosk_asr/models:/app/models
      - ./pip_cache:/root/.cache/pip

  gemini-server:
    build: ./gemini_server
    container_name: gemini-server
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8765:8765"
    restart: unless-stopped

  node-website:
    build: ./website
    container_name: node_website
    ports:
      - "3000:3000"  # Expose port 3000 to access the app
    restart: always
