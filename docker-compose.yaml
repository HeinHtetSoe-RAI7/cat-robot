services:
  vosk_asr:
    container_name: vosk_asr
    build: ./vosk_asr
    ports:
      - "2700:2700"
    volumes:
      - ./vosk_asr/models:/app/models
      - ./pip_cache:/root/.cache/pip
    # No dependencies - this is a standalone service

  gemini-server:
    build: ./gemini_server
    container_name: gemini-server
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgres://username:password@postgresql:5432/catgpt?sslmode=disable
    ports:
      - "8765:8765"
    restart: unless-stopped
    # No dependencies - standalone service

  node-website:
    build: ./website
    container_name: node_website
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - vosk_asr
      - gemini-server
    environment:
      - VOSK_WS_URL=ws://vosk_asr:2700
      - GEMINI_WS_URL=ws://gemini-server:8765

  # go-website:
  #   build: ./website
  #   container_name: go-website
  #   ports:
  #     - "8080:8080"
  #   restart: always
  #   depends_on:
  #     - vosk_asr
  #     - gemini-server
  #     - postgresql

  postgresql:
    image: postgres:13-alpine3.21
    container_name: postgresql
    environment:
      POSTGRES_USER: username
      POSTGRES_PASSWORD: password
      POSTGRES_DB: catgpt
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped

volumes:
  postgres_data:
