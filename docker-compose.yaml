services:
  vosk_asr:
    container_name: vosk_asr
    build: ./vosk_asr
    ports:
      - "2700:2700"
    volumes:
      - ./vosk_asr/models:/app/models
      - ./pip_cache:/root/.cache/pip
    # No dependencies - this is a standalone service

  gemini-server:
    build: ./gemini_server
    container_name: gemini-server
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8765:8765"
    restart: unless-stopped
    # No dependencies - standalone service

  node-website:
    build: ./website
    container_name: node_website
    ports:
      - "3000:3000"
    restart: always
    depends_on:
      - vosk_asr
      - gemini-server
    environment:
      - VOSK_WS_URL=ws://vosk_asr:2700
      - GEMINI_WS_URL=ws://gemini-server:8765